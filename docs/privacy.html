function pick() {
  const q = (new URLSearchParams(location.search).get("lang") || "").toLowerCase();
  if (P[q]) return q;
  try { const s = (localStorage.getItem("pacemaker_lang") || "").toLowerCase(); if (P[s]) return s; } catch (_) {}
  return "en";
}
function render(lang) {
  const d = P[lang] || P.en;
  document.documentElement.lang = lang;
  document.title = "PACE MAKER - " + d.title;
  document.getElementById("lang-select").value = lang;
  document.getElementById("title").textContent = d.title;
  document.getElementById("date").textContent = d.date;
  document.getElementById("back").href = "./index.html?lang=" + lang;
  const body = document.getElementById("body");
  body.replaceChildren();
  for (const [h, items] of d.s) {
    const sec = document.createElement("section");
    const h2 = document.createElement("h2"); h2.textContent = h; sec.append(h2);
    if (items.length === 1) { const p = document.createElement("p"); p.textContent = items[0]; sec.append(p); }
    else { const ul = document.createElement("ul"); for (const t of items) { const li = document.createElement("li"); li.textContent = t; ul.append(li); } sec.append(ul); }
    body.append(sec);
  }
}
document.getElementById("lang-select").addEventListener("change", (e) => render(e.target.value));
render(pick());
</script>
</body>
</html>
