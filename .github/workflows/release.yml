name: release

# Runs ONLY when a version tag is pushed (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
# Uploads directly to a DRAFT GitHub Release (uses 0 bytes of Actions Artifact storage).
# A human reviews the draft release and presses "Publish". No secrets are used.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage bundled model files
        run: |
          mkdir -p release
          for f in model_extended.onnx distribution_stats.json; do
            if [ -f "assets/$f" ]; then cp "assets/$f" release/; fi
          done
      - name: Create draft release with model assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Pin Python 3.12 and run full test suite
        run: |
          uv python install 3.12
          uv sync --python 3.12 --all-groups
          uv run --python 3.12 python -m pytest -q
      - name: Build lightweight app (exclude training packages)
        run: |
          uv sync --python 3.12 --group build
          uv run --python 3.12 python scripts/build.py
      - name: Build Windows 1-click installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          & $iscc "/DMyAppVersion=$ver" scripts\installer.iss
          Get-Item dist\LoLPacemaker-Setup.exe
      - name: Upload OS binary directly to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/LoLPacemaker-*.zip --clobber
          if [ -f dist/LoLPacemaker-Setup.exe ]; then
            gh release upload "${GITHUB_REF_NAME}" dist/LoLPacemaker-Setup.exe --clobber
          fi

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download draft release assets and publish checksums.sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "${GITHUB_REF_NAME}" -D release
          cd release
          python3 ../scripts/make_checksums.py checksums.sha256 $(ls | grep -v '^checksums.sha256$')
          cat checksums.sha256
          gh release upload "${GITHUB_REF_NAME}" checksums.sha256 --clobber
